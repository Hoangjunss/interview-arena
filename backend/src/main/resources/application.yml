server:
  port: 8080
  forward-headers-strategy: native

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/interview_arena}
    username: ${DB_USERNAME:interview_arena}
    password: ${DB_PASSWORD:interview_arena}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: interview-arena-backend
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.interviewarena.interview"

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-do-not-use-in-prod-please-change-to-something-longer}
    expiration-minutes: 120
  llm:
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_API_BASE_URL:https://api.openai.com/v1}
    model: ${LLM_MODEL:gpt-4o-mini}
  judge0:
    base-url: ${JUDGE0_BASE_URL:http://localhost:2358}
  dsa:
    free-daily-quota: ${DSA_FREE_DAILY_QUOTA:20}
    max-source-length: 20000


management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: when_authorized
